<!DOCTYPE html>
<html>
<head>
    <style>
        /* 重置默认边距，避免滚动条或留白 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%; /* 确保html/body占满整个视口高度 */
            overflow: hidden; /* 可选：禁止滚动 */
        }

        body {
            background-image: url('https://picui.ogmua.cn/s1/2026/03/13/69b3f5c619147.webp');
            background-repeat: no-repeat;
            /* 核心属性：让背景铺满 */
            background-size: cover; /* 覆盖整个容器，保持比例，裁剪超出部分 */
            background-position: center center; /* 图片居中显示 */
            background-attachment: fixed; /* 可选：滚动时背景固定 */
        }
        .mi{
            position: absolute;
            /* 核心修改1：绝对定位居中 */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* 确保文字本身也水平居中（应对多行/宽内容） */
            text-align: center;
            background-color: rgb(0, 0, 0,0.5);
            padding: 20px 40px;
            border-radius: 10px;
            backdrop-filter: blur(3px);
        }
        .mi p{
            font-size: 30px;
            color: white;
            font-family: "Microsoft YaHei", sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            /* 移除不必要的relative，避免干扰 */
            position: static;
            /* 可选：去掉a标签的默认下划线 */
        }
        /* 可选：去除a标签默认下划线，保持文字美观 */
        .mi p a {
            color: inherit;
            text-decoration: none;
        }
        /* 可选：鼠标悬浮时加下划线，提升交互 */
        .mi p a:hover {
            text-decoration: underline;
        }

    </style>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>未若空蒙一色，更起明日惊秋</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    <div class="mi">
        <p><a href="https://aradg114514.github.io/min_pian/zhou.html">周</a></p>
        <br>
        <p style="font-size: 15px;">万籁丛生俱灭，怎叹碑文刻</p>
    </div>
</body>
</html>
