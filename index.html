<!DOCTYPE html>
<html>
<head>
    <style>
        /* 重置默认样式，避免边距影响 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .name-input {
            border: 2px solid #46bcb2; /* 绿色边框 */
            border-radius: 20px; /* 圆角 */
            padding: 20px; /* 内边距 */
            font-size: 20px; /* 字体大小 */
            margin: 10px 0; /* 增加上下间距 */
            width: 100%; /* 输入框宽度自适应 */
        }
        .password {
            border-radius: 20px;
            border: 2px solid #46bcb2;
            padding: 20px;
            font-size: 20px;
            margin: 10px 0; /* 增加上下间距 */
            width: 100%; /* 输入框宽度自适应 */
        }
        .gy {
            border-radius: 20px;
            border: 2px solid #46bcb2;
            padding: 10px;
            font-size: 20px;
            background-color: #46bcb2; /* 按钮背景颜色 */
            color: white; /* 按钮文字颜色 */
            cursor: pointer; /* 鼠标悬停时显示为指针 */
            width: 100%; /* 按钮宽度自适应 */
            margin-top: 15px; /* 增加顶部间距 */
        }
        .parallax{
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            height: 100vh; /* 改为视口高度，铺满屏幕 */
            width: 100%;
            overflow: hidden; /* 隐藏滚动条 */
            position: relative; /* 关键：让子元素的绝对定位相对于自己 */
            /* 修复背景图片路径格式（需替换为实际有效路径） */
            background-image: url("https://youke.xn--y7xa690gmna.cn/s1/2026/02/12/698de81db4fd5.webp");
        }
        /* 登录面板居中样式 */
        .lp {
            position: absolute; /* 绝对定位 */
            top: 50%; /* 垂直居中 */
            left: 50%; /* 水平居中 */
            transform: translate(-50%, -50%); /* 偏移自身一半，实现真正居中 */
            background-color: rgba(255, 255, 255, 0.6); /* 半透明白色背景，提升可读性 */
            padding: 30px;
            backdrop-filter: blur(3px);
            border-radius: 20px;
            width: 400px; /* 固定面板宽度，可根据需求调整 */
            max-width: 90%; /* 适配移动端，最大宽度不超过90% */
            border: 2px solid #46bcb2; /* 面板边框 */
        }
        /* 表单样式优化 */
        form {
            display: flex;
            flex-direction: column; /* 垂直排列表单元素 */
        }
        .wb{
            position: absolute;
            font-size: 40px;
            /* 新增/修改以下样式，实现上方中央 */
            top: 20px; /* 距离顶部20px，可根据需求调整 */
            left: 50%; /* 水平居中 */
            transform: translateX(-50%); /* 向左偏移自身50%，实现真正水平居中 */
            width: 100%; /* 确保文字居中对齐 */
            text-align: center; /* 文字水平居中 */
            color: #fff; /* 可选：添加文字颜色，提升与背景的对比度 */
            text-shadow: 0 0 5px rgba(0,0,0,0.5); /* 可选：添加文字阴影，增强可读性 */
        }
        
    </style>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>登录界面</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    
    <div class="parallax">
        <p class="wb">
            尘世你我，终将相遇
        </p>
        <div class="lp">
            <form>
                用户名：<input class="name-input" type="text" name="name"> <!-- 修正type为text，没有name类型 -->
                密码：<input class="password" type="password" name="password">
                <input class="gy" type="submit" value="登录">
            </form>
        </div>
    </div>
</body>
</html>
